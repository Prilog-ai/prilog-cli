name: Plugin packages
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install jsonschema==4.26.0
      - run: python scripts/package-plugin.py --check
      - run: python scripts/package-plugin.py
      - uses: actions/upload-artifact@v4
        with:
          name: prilog-plugin-packages
          path: dist/plugin/*.zip
